name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  BUN_VERSION: "1.3.14"

jobs:
  check:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared configs
        run: bun --cwd ./packages/configs/vitest run build

      - name: Type-check
        run: bun run type-check

      - name: Test
        run: bun run test

      - name: Lint
        run: bun run lint || echo "lint warnings present"
